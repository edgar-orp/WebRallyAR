<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Bienvenido a WebAR Rally</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      display: flex; justify-content: center; align-items: center;
      font-family: sans-serif; background: #111; color: white;
    }
    #container { text-align: center; }
    input, button {
      padding: 1em; font-size: 1.2em; margin: 10px;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAV2jHyfZ9WxLwOVO7BRZYce73Xia1oRRU",
      authDomain: "webrallyar.firebaseapp.com",
      projectId: "webrallyar",
      storageBucket: "webrallyar.appspot.com",
      messagingSenderId: "388094391567",
      appId: "1:388094391567:web:073e9b29edd428ec8e7a7a",
      measurementId: "G-44923GKZFM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.doc = doc;
    window.getDoc = getDoc;
    window.setDoc = setDoc;
    window.serverTimestamp = serverTimestamp;

    async function saveUser(userId) {
      const userRef = doc(db, "participants", userId);
      const userSnap = await getDoc(userRef);
      if (!userSnap.exists()) {
        await setDoc(userRef, {
          user_id: userId,
          timestamp: serverTimestamp(),
          scanned_targets: []
        });
      }
    }

    window.saveUser = saveUser;
  </script>
</head>
<body>
  <div id="container">
    <h1>WebAR Rally</h1>
    <p>Ingresa tu correo o ID:</p>
    <input type="text" id="userIdInput" placeholder="Tu correo o ID..." />
    <br />
    <button onclick="startExperience()">Comenzar</button>
  </div>

  <script>
    async function startExperience() {
      const userId = document.getElementById("userIdInput").value.trim();
      if (!userId) {
        alert("Por favor ingresa tu ID o correo.");
        return;
      }

      try {
        await saveUser(userId);
        console.log("✅ Usuario guardado o ya existente:", userId);
      } catch (error) {
        console.error("❌ Error guardando usuario en Firestore:", error);
        alert("Error guardando tu información. Intenta de nuevo.");
        return;
      }

      localStorage.setItem("user_id", userId);
      window.location.href = "ar.html";
    }
  </script>
</body>
</html>
