<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bienvenido a WebAR Rally</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background: #111;
      color: white;
    }
    #container {
      text-align: center;
    }
    input, button {
      padding: 1em;
      font-size: 1.2em;
      margin: 10px;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>WebAR Rally</h1>
    <p>Ingresa tu correo o ID:</p>
    <input type="text" id="userIdInput" placeholder="Tu correo o ID..." />
    <br />
    <button onclick="startExperience()">Comenzar</button>
  </div>

  <script>
    function startExperience() {
      const userId = document.getElementById("userIdInput").value.trim();
      if (!userId) {
        alert("Por favor ingresa tu ID o correo.");
        return;
      }
      localStorage.setItem("user_id", userId);
      window.location.href = "ar.html";
    }
  </script>
</body>
</html>
